# immich-apparent-age - GPU overlay (phase 2, estimate)
#
# Phase 2 is the only GPU-bound stage, and it reads cached crops from /data
# rather than talking to Immich. That is why it can run on a different host
# from extraction: point this at whichever card actually has room.
#
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml \
#       run --rm iaa estimate.py --config /data/config.yaml
#
# Requires the Unraid Nvidia Driver plugin on the host, and IAA_GPU_UUID set to
# the specific card (not "all"): these hosts have more than one GPU, and the
# wrong one may be fully committed to something else.
#
# Phase 2 does not exist yet. This file is here so the deployment decision is
# recorded and testable the moment estimate.py lands.

services:
  iaa:
    image: ${IAA_IMAGE_GPU:-ghcr.io/rhamblen/immich-apparent-age:gpu}
    runtime: nvidia
    environment:
      # A GPU UUID, from `nvidia-smi -L` on the host. Never "all" - pin the
      # card so this cannot land on one that is already loaded.
      NVIDIA_VISIBLE_DEVICES: ${IAA_GPU_UUID:?set IAA_GPU_UUID in deploy/.env}
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    command: ["estimate.py", "--config", "/data/config.yaml"]
