# immich-apparent-age — example configuration
#
# Copy to config.yaml (gitignored) and fill in. Nothing in this file that
# identifies a real person or host should ever be committed: config.yaml holds
# the host address, the API key, and the person -> birth date mapping, and the
# repo holds only the method.

immich:
  # Your Immich server. Default port is 2283 for the official compose file.
  base_url: http://immich.local:2283
  # Read-only use is enough for phases 1-4. Prefer the env var over a literal.
  api_key: ${IMMICH_API_KEY}
  # Immich's face bounding boxes are expressed against the *preview* image and
  # carry their own imageWidth/imageHeight, so crops must be taken from the
  # same rendition the boxes were computed on. See ADR 0004.
  image_source: preview        # preview | original
  request_timeout_s: 30
  max_concurrency: 4           # be kind to the ML container if it is busy

# Ground truth. Only people with a known birth date can produce a residual;
# everyone else is skipped. person_id comes from GET /api/people.
# `label` is what appears in reports — keep real names out of git.
people:
  - person_id: 00000000-0000-0000-0000-000000000000
    label: person_a
    birth_date: 1970-01-01
  - person_id: 11111111-1111-1111-1111-111111111111
    label: person_b
    birth_date: 1970-02-01

# Faces that fail these gates are stored but excluded from analysis, so the
# thresholds can be re-tuned without re-extracting. See ADR 0008.
quality:
  min_crop_px: 112             # shorter edge of the face crop, in pixels
  min_laplacian_var: 60.0      # blur gate; tune against your own library
  max_yaw_deg: 30              # only applied if the model reports pose
  exclude_videos: true         # phase 1 is stills only

model:
  name: mivolo                 # mivolo | dex-apparent | insightface-genderage
  weights: models/mivolo_imdb.pth
  device: cuda                 # cuda | cpu
  batch_size: 32

analysis:
  min_faces_per_person: 50     # below this, report n but suppress conclusions
  calibration: isotonic        # isotonic | linear | none  (see ADR 0005)
  # A same-photo pair needs two configured people with usable crops in one
  # asset. These are the comparisons that survive peer review. See ADR 0006.
  same_photo_pairs: true

output:
  database: out/apparent-age.db
  report_dir: reports/
