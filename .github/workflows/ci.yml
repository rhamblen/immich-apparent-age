name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Matches the container, which is where this actually runs.
          python-version: "3.12"
          cache: pip

      - name: install
        run: pip install -r requirements.txt

      - name: unit tests
        run: python -m unittest discover -s tests -t . -v

  image:
    name: cpu image
    runs-on: ubuntu-latest
    needs: test
    # Nothing is published from a pull request.
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # Only the CPU target. The GPU target carries the CUDA runtime and torch,
      # which is several GB and pointless until phase 2 (estimate.py) exists.
      - id: build
        name: build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: base
          # Unraid is amd64; a second platform would double build time for
          # nothing.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # By digest, not by tag: an exact reference to the image just pushed,
      # with no assumptions about how the tag was rendered.
      - name: smoke test the published image
        run: |
          docker run --rm \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}" \
            -m unittest discover -s tests -t .
